# Each morning: fetch new USF basketball games from ESPN and, when one arrived, rebuild
# basketball/ (men) and basketball/women/ (women) and commit them. A push that changes the
# pipeline rebuilds the pages right away.
# Source of this file: lanes/ad/usf_hoops_network/github/basketball.yml in Alex's lab repo;
# publish_site.py copies it to .github/workflows/basketball.yml.
name: Basketball assist networks

on:
  schedule:
    - cron: "30 14 * * *"   # 6:30 am Pacific in winter, 7:30 am in summer
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "_pipeline/basketball/**"
      - ".github/workflows/basketball.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: basketball-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new games and rebuild the pages
        id: build
        run: python -I -B _pipeline/basketball/update_site.py ${{ github.event_name == 'push' && '--force' || '' }}

      - name: Commit and push
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball _pipeline/basketball/data
          if git diff --cached --quiet; then echo "Pages unchanged."; exit 0; fi
          git commit -m "Basketball: assist networks through ${{ steps.build.outputs.through }}"
          git pull --rebase
          git push
          # Ask Pages to rebuild in case a push from this job does not start one by itself.
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
